name: build
permissions:
  contents: write
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: setup jdk 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: setup gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'
      - name: build
        shell: bash
        run: gradle build --stacktrace --no-daemon 2>&1 | tee build.log
      - name: smoke test (real server)
        shell: bash
        run: ./tools/smoke.sh 2>&1 | tee smoke-out.log
      - name: upload jar
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: happy-ghast-upgrades
          path: build/libs/
      - name: upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
      - name: publish log to ci-logs branch
        if: always() && github.event_name == 'push'
        shell: bash
        run: |
          mkdir -p /tmp/cilog && cp build.log /tmp/cilog/build.log || true; cp smoke.log /tmp/cilog/smoke.log || true; cp smoke-out.log /tmp/cilog/smoke-out.log || true
          cd /tmp/cilog
          git init -q && git checkout -q -b ci-logs
          git config user.name ci && git config user.email ci@example.com
          echo "${GITHUB_REF_NAME} ${GITHUB_SHA}" > ref.txt
          git add -A && git commit -qm "log for ${GITHUB_SHA}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" ci-logs
      - name: publish dev jar as prerelease
        if: success() && github.event_name == 'push' && github.ref_name == 'dev'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          JAR=$(ls build/libs/happy-ghast-upgrades-*.jar | grep -v sources | head -1)
          gh release delete dev-latest -y --cleanup-tag || true
          gh release create dev-latest "$JAR" --prerelease --target dev --title "Latest dev build" --notes "Automatic build of the dev branch (${GITHUB_SHA})."
      - name: publish main jar as the latest release
        if: success() && github.event_name == 'push' && github.ref_name == 'main'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          JAR=$(ls build/libs/happy-ghast-upgrades-*.jar | grep -v sources | head -1)
          gh release delete latest -y --cleanup-tag || true
          gh release create latest "$JAR" --latest --target main --title "Happy Ghast Upgrades (latest)" --notes "Automatic build of the main branch (${GITHUB_SHA}). Needs Minecraft 26.3, Fabric Loader 0.19.5+, Java 25 and Fabric API. Server-side only."
